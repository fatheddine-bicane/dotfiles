#----------------------------------------------------------------------------#
# Catppuccin Mocha Color Scheme for Alacritty
# Based on the official palette provided
[colors]
  [colors.primary]
    background = "#1e1e2e" # base
    foreground = "#cdd6f4" # text

  # Normal colors
  [colors.normal]
    black   = "#45475a" # surface1
    red     = "#f38ba8"
    green   = "#a6e3a1"
    yellow  = "#f9e2af"
    blue    = "#89b4fa"
    magenta = "#f5c2e7" # pink
    cyan    = "#94e2d5" # teal
    white   = "#bac2de" # subtext1

  # Bright colors
  [colors.bright]
    # This 'black' determines your tmux status bar text background
    black   = "#585b70" # surface2
    red     = "#f38ba8"
    green   = "#a6e3a1"
    yellow  = "#f9e2af"
    blue    = "#89b4fa"
    magenta = "#f5c2e7" # pink
    cyan    = "#94e2d5" # teal
    white   = "#a6adc8" # subtext0

  [colors.selection]
    background = "#585b70" # surface2
    foreground = "#cdd6f4" # text
