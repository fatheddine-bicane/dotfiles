# --- GENERAL SETTINGS ---
# Unbind the default prefix
unbind C-b

# Set Ctrl + Space as the new prefix
set-option -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1          # Window index start with 1 not 0
set -g renumber-windows on   # Renumber windows if one is deleted
set -g mouse on              # Enable mouse support

# Tell tmux to use 24-bit color
set-option -ga terminal-overrides ',*:Tc'
# Set the TERM variable correctly
set -g default-terminal "tmux-256color"
# Set status bar at the top
set -g status-position top

# --- KEY BINDINGS ---
unbind r
bind r source-file ~/.tmux.conf

# Split panes with leader + k/l
unbind '"'
unbind %
bind k split-window -v
bind l split-window -h

# Hide all open panels except the focused one
bind-key h resize-pane -Z

# Resize pane with Option(Alt) + Arrow keys
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen keybind mapped over by tmux-navigator
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'send-keys C-l'

# Copy mode bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'

# Kept because your status bar uses scripts from this plugin (battery.sh, network.sh)
set -g @plugin 'Nybkox/tmux-kanagawa'

# Commented out theme settings so they don't override your manual colors below
# set -g @kanagawa-theme 'dragon' 

# Initialize TMUX plugin manager (keep this line at the very bottom of plugins)
run '~/.tmux/plugins/tpm/tpm'


# --- VISUAL OVERRIDES (DYNAMIC TERMINAL COLORS) ---

# Status bar background (transparent/default to match terminal)
set-option -g status-style "bg=default fg=white"

# Window styling
set-option -g window-style "bg=default"
set-option -g window-active-style "bg=default"

# Borders
set-option -g pane-active-border-style "fg=white"
set-option -g pane-border-style "fg=brightblack"

# Window Status Colors
set-option -g window-status-style "fg=white"
set-option -g window-status-current-style "fg=white,bold"

# Kanagawa Icon Settings (Visual structure only)
set -g @kanagawa-left-icon-padding 0
set -g @kanagawa-right-icon-padding 0
set -g @kanagawa-show-powerline true
set -g @kanagawa-show-left-sep ''
set -g @kanagawa-show-right-sep ''

# --- STATUS BAR CONTENT ---
# Colors are now mapped to ANSI names (red, blue, yellow, etc.)
# "brightblack" maps to your terminal's Grey/Bright Black color.

# Left Status
# Logic: If prefix pressed -> Yellow (Action), else -> Bright Black (Inactive)
set -g status-left "#[fg=#{?client_prefix,yellow,brightblack},bg=default]#[fg=#{?client_prefix,black,green},bg=#{?client_prefix,yellow,brightblack}]  #[fg=#{?client_prefix,yellow,brightblack},bg=default] "

# Right Status
# Uses scripts from the kanagawa plugin folder
# Battery -> Yellow | Network -> Blue | Date -> Green
set -g status-right "#[fg=yellow,bg=default]#[fg=black,bg=yellow] #(~/.tmux/plugins/tmux-kanagawa/scripts/battery.sh) #[fg=yellow,bg=brightblack] #(~/.tmux/plugins/tmux-kanagawa/scripts/battery.sh percent) #[fg=brightblack,bg=default] #[fg=blue,bg=default]#[fg=black,bg=blue] #(~/.tmux/plugins/tmux-kanagawa/scripts/network.sh) #[fg=black,bg=blue] #[fg=blue,bg=brightblack] #(ipconfig getsummary en0 | awk -F ' SSID : ' '/ SSID : / {print $2}' | xargs) #[fg=brightblack,bg=default] #[fg=green,bg=default]#[fg=black,bg=green]  #[fg=green,bg=brightblack] %m-%d | %I:%M %p #[fg=brightblack,bg=default]"

# Current Window (Active) -> Red
set -g window-status-current-format "#[fg=red,bg=default]#[fg=black,bg=red] #I #[fg=red,bg=brightblack] #W #[fg=brightblack,bg=default]"

# Inactive Window -> Blue
set -g window-status-format "#[fg=blue,bg=default]#[fg=black,bg=blue] #I #[fg=blue,bg=brightblack] #W #[fg=brightblack,bg=default]"
